<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格</title>
</head>
<body>
   <table border="1">
    <thead>
        <tr>
            <th>姓名</th>
            <th>语文</th>
            <th>数学</th>
            <th>总分</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th>张三</th>
            <td>99</td>
            <td>100</td>
            <td>199</td>
        </tr>
        <tr>
            <th>李四</th>
            <td>98</td>
            <td>100</td>
            <td>198</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <th>总结</th>
            <td>全市第一</td>
            <td>全市第一</td>
            <td>全市第一</td>
        </tr>
    </tfoot>
   </table> 
</body>
</html>
